<title>Rally Geração 252</title>
<meta name="description" content="Os Heróis do Antigo Testamento: percorra as 16 etapas do Rally e libere o Quiz.">

<style>
/* Fontes hospedadas no próprio site (SIL Open Font License), só o subconjunto latino */
@font-face { font-family: "Rubik"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(fonts/rubik-latin.woff2) format("woff2"); }
@font-face { font-family: "Rubik Dirt"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/rubik-dirt-latin.woff2) format("woff2"); }

/* Mobile first. Mundo do Rally: cores da logo Geração 252 (marinho, vermelho, verde, laranja)
   sobre terrenos de pista (terra, lama, areia, neve). Visual único, sem modo escuro, por escolha. */
:root {
  --navy: #0b0a5e;
  --navy-2: #1b1a86;
  --red: #e8343a;
  --green: #2fb52f;
  --orange: #ff6a00;
  --paper: #fffaf0;
  --ink: #1d1b3a;
  --muted: #625d78;
  --line: #e6dcc6;
  --gold-soft: #ffe9cf;
  --ok: #1f8f2f;
  --ok-soft: #dff3df;
  --bad: #c8282e;
  --bad-soft: #fbdede;
  --display: "Rubik Dirt", Impact, "Arial Black", sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* ---------- Abertura ---------- */
#intro { position: fixed; inset: 0; z-index: 60; background: radial-gradient(120% 80% at 50% 35%, var(--navy-2), var(--navy) 70%); color: #fff; overflow: hidden; display: grid; place-items: center; transition: opacity .5s; }
#intro.out { opacity: 0; pointer-events: none; }
.i-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background:
  radial-gradient(circle at 20% 30%, rgba(0,0,0,.25) 0 6px, transparent 7px) 0 0 / 46px 30px,
  linear-gradient(#8a5a2b, #4a3220); }
.i-ground::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 20px; background: radial-gradient(circle at 10px 10px, #8a5a2b 9px, transparent 10px) 0 0 / 26px 20px; }
.i-car { position: absolute; bottom: calc(24% - 6px); left: 0; width: 150px; animation: drive 1.5s cubic-bezier(.25,.8,.3,1) forwards, bump .25s 1.5s 3 ease-in-out; }
.i-car svg { width: 100%; height: auto; display: block; }
@keyframes drive { from { transform: translateX(-180px); } to { transform: translateX(calc(50vw - 75px)); } }
@keyframes bump { 50% { margin-bottom: 4px; } }
.puff { position: absolute; left: -10px; bottom: 4px; width: 26px; height: 26px; border-radius: 50%; background: #c99a63; opacity: 0; animation: puff .7s ease-out infinite; }
.puff:nth-child(2) { animation-delay: .23s; bottom: 12px; }
.puff:nth-child(3) { animation-delay: .46s; }
@keyframes puff { 0% { transform: scale(.4) translateX(0); opacity: .9; } 100% { transform: scale(2.2) translateX(-50px); opacity: 0; } }
.i-car.stop .puff { animation-iteration-count: 2; }
/* conteúdo sempre acima da pista: o carro ocupa ~80px acima do chão (24%) */
.i-center { position: absolute; z-index: 2; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 52px); bottom: calc(24% + 96px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 var(--gutter-r) 0 var(--gutter-l); text-align: center; }
.i-logo { width: min(58vw, 240px, 26vh); background: #fff; border-radius: 50%; padding: 18px; opacity: 0; transform: scale(.3) rotate(-12deg); animation: pop .6s 1.35s cubic-bezier(.3,1.6,.5,1) forwards; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
.splat { position: absolute; width: 90px; height: 70px; opacity: 0; animation: splat .45s 1.25s ease-out forwards; }
.splat.s1 { background: var(--green); border-radius: 60% 40% 55% 45%; left: -40px; top: 20px; }
.splat.s2 { background: var(--orange); border-radius: 45% 55% 40% 60%; right: -46px; top: 60px; animation-delay: 1.32s; }
.splat.s3 { background: var(--red); border-radius: 50% 50% 60% 40%; left: 30%; bottom: 50px; width: 60px; height: 46px; animation-delay: 1.4s; }
@keyframes splat { from { transform: scale(0); opacity: 1; } to { transform: scale(1); opacity: .95; } }
@keyframes pop { to { opacity: 1; transform: scale(1) rotate(0); } }
.i-logo-wrap { position: relative; }
.i-title { font-family: var(--display); font-size: clamp(36px, min(15vw, 8vh), 78px); line-height: .95; color: var(--orange); margin: 10px 0 0; opacity: 0; animation: rise .5s 1.8s forwards; letter-spacing: .02em; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
.i-sub { margin: 0; font-weight: 600; opacity: 0; animation: rise .5s 2s forwards; }
.i-go { margin-top: 14px; opacity: 0; animation: rise .5s 2.3s forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.btn { border: 0; border-radius: 999px; font-weight: 800; font-size: 17px; padding: 13px 24px; background: var(--orange); color: #fff; box-shadow: 0 4px 0 #b84a00; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b84a00; }
.btn.ghost { background: #fff; color: var(--navy); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.i-skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: var(--gutter-r); background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 600; z-index: 3; }

/* ---------- Barra do topo ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 30; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); min-height: 56px; }
.top img { width: 40px; height: 40px; background: #fff; border-radius: 50%; padding: 3px; }
.top .t-name { font-family: var(--display); font-size: 20px; line-height: 1; flex: 1; min-width: 0; }
.top .t-name small { display: block; font-family: var(--body); font-size: 12px; font-weight: 600; opacity: .8; margin-top: 3px; }
.pill { background: var(--orange); color: #fff; font-weight: 800; border-radius: 99px; padding: 5px 11px; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.back { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 99px; padding: 8px 12px; font-weight: 700; font-size: 15px; }

/* ---------- Mapa ---------- */
.hero { padding: 20px var(--gutter-r) 18px var(--gutter-l); background: var(--navy); color: #fff; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 9vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
.hero p { margin: 0; opacity: .92; }
.pais { background: #fff; color: var(--ink); border-radius: 12px; padding: 12px 14px; border-left: 6px solid var(--orange); font-size: 14.5px; }
.pais .ph { display: block; margin-bottom: 2px; font-size: 15px; font-weight: 800; }
.pais details { margin-top: 8px; }
.pais summary { cursor: pointer; font-weight: 800; color: var(--navy); padding: 4px 0; }
.pais ol { margin: 6px 0; padding-left: 20px; display: grid; gap: 4px; }
.pais details p { margin: 4px 0 0; }
.codebox { border: 2px dashed rgba(255,255,255,.45); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.codebox .lbl { font-weight: 800; }
.code-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.code { font: 800 22px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; user-select: all; -webkit-user-select: all; }
.mini { border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 800; font-size: 14px; background: var(--orange); color: #fff; }
.mini.alt { background: rgba(255,255,255,.18); }
.restore { display: flex; gap: 8px; }
.restore input { flex: 1; min-width: 0; font: 700 17px ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; padding: 9px 10px; border-radius: 10px; border: 2px solid #fff; color: var(--ink); background: #fff; }
.msg { margin: 0; font-weight: 700; }
.msg.ok { color: #a6f5a6; } .msg.no { color: #ffc2c2; }
.map { position: relative; }
.road { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.start { position: relative; z-index: 2; text-align: center; padding: 18px 0 6px; background: #c58a4f; }
.flagstrip { display: inline-block; font-family: var(--display); color: #fff; font-size: 22px; padding: 6px 18px 4px; background: var(--navy); border-radius: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.zone { position: relative; padding: 16px var(--gutter-r) 26px var(--gutter-l); }
.zone h2 { position: relative; z-index: 2; margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .02em; display: inline-block; padding: 5px 12px 3px; border-radius: 6px; }
.zone h2 small { font-family: var(--body); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; margin-left: 6px; opacity: .85; }
.z1 { background: radial-gradient(circle at 30% 40%, rgba(90,50,20,.25) 0 5px, transparent 6px) 0 0 / 38px 34px, #c58a4f; }
.z1 h2 { background: #fff3e2; color: #6a3f17; }
.z2 { background: radial-gradient(ellipse at 50% 50%, rgba(25,15,5,.35) 0 14px, transparent 15px) 0 0 / 70px 46px, radial-gradient(circle at 20% 70%, rgba(120,80,40,.5) 0 4px, transparent 5px) 0 0 / 30px 30px, #5b3b22; }
.z2 h2 { background: #2b1b0e; color: #ffd9b0; }
.z3 { background: repeating-radial-gradient(ellipse at 50% 120%, transparent 0 18px, rgba(190,140,60,.25) 19px 21px, transparent 22px 40px) 0 0 / 120px 60px, #ecd29b; }
.z3 h2 { background: #fff7e2; color: #8a5a12; }
.z4 { background: radial-gradient(circle at 40% 40%, #fff 0 3px, transparent 4px) 0 0 / 28px 26px, linear-gradient(#dcebf8, #f5f9fd); }
.z4 h2 { background: var(--navy); color: #fff; }
.stops { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 22px; }
.stop { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.stop button { width: 66px; height: 66px; border-radius: 50%; border: 4px solid #fff; font-family: var(--display); font-size: 28px; color: #fff; background: var(--navy); box-shadow: 0 4px 0 rgba(0,0,0,.3); position: relative; padding: 0; }
.stop.done button { background: var(--green); }
.stop.done button::after { content: "✓"; position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--ok); font: 800 15px/24px var(--body); }
.stop.next button { background: var(--orange); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 0 0 10px rgba(255,106,0,.35); } }
.stop.soon button { background: #9a96aa; border-color: #e7e4ee; cursor: default; }
.stop .name { font-size: 12.5px; font-weight: 700; line-height: 1.25; background: rgba(255,255,255,.92); color: var(--ink); padding: 3px 7px; border-radius: 6px; max-width: 118px; }
.stop.soon .name { color: var(--muted); font-weight: 600; }
.car-on-map { position: absolute; z-index: 3; width: 64px; pointer-events: none; transition: left .6s, top .6s; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.finish { position: relative; z-index: 2; padding: 22px var(--gutter-r) 34px var(--gutter-l); text-align: center; background:
  conic-gradient(#111 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0 / 28px 28px; }
.finish-card { background: #fff; border-radius: 16px; padding: 18px 16px; display: grid; gap: 10px; justify-items: center; max-width: 420px; margin: 0 auto; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.finish-card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--navy); }
.finish-card p { margin: 0; color: var(--muted); }
.bar { width: 100%; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.testmode { font-size: 13px; color: var(--bad); font-weight: 700; }

/* ---------- Lição ---------- */
.page { padding: 18px var(--gutter-r) 40px var(--gutter-l); display: grid; gap: 22px; max-width: 680px; margin: 0 auto; }
.etapa { display: flex; align-items: center; gap: 12px; }
.etapa .num { flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: #fff; background: var(--navy); border: 4px solid var(--orange); }
.etapa .meta { min-width: 0; }
.etapa .zl { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); }
.page h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.2; font-weight: 800; color: var(--navy); text-wrap: balance; }
.ref { color: var(--muted); font-weight: 600; font-size: 14.5px; }
.page h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 23px; color: var(--navy); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.page h2::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--orange); transform: rotate(45deg); flex: none; }
.verse { background: var(--navy); color: #fff; border-radius: 14px; padding: 16px; }
.verse .vt { font-size: 18.5px; line-height: 1.7; font-weight: 600; }
.verse .w { display: inline-block; }
.verse .w.hid { color: transparent; border-bottom: 3px solid var(--orange); min-width: 2em; cursor: pointer; }
.verse cite { display: block; font-style: normal; font-weight: 800; color: var(--orange); margin-top: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.sbtn { border: 2px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 99px; padding: 9px 14px; font-weight: 700; font-size: 15px; }
.sbtn.main { background: var(--orange); border-color: var(--orange); }
.note { font-size: 13.5px; opacity: .8; margin: 10px 0 0; }
.resumo p { margin: 0; }
.pontos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pontos li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.pontos li span { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 17px; }
.vida { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; border-left: 6px solid var(--orange); }
.day { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.day .dh { display: flex; align-items: center; gap: 10px; }
.day .tag { background: var(--navy); color: #fff; font-family: var(--display); font-size: 17px; padding: 4px 10px 2px; border-radius: 6px; }
.day .lr { font-size: 13px; font-weight: 800; color: var(--orange); letter-spacing: .05em; text-transform: uppercase; }
.day p { margin: 0; font-weight: 600; }
textarea { width: 100%; font: 16px var(--body); color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; resize: vertical; min-height: 56px; }
.ans { background: var(--gold-soft); border-radius: 10px; padding: 8px 12px; font-weight: 700; margin: 0; }
.dbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
label.chk { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 15px; }
label.chk input { width: 22px; height: 22px; accent-color: var(--green); }
.link { border: 0; background: none; color: var(--navy); text-decoration: underline; font-weight: 700; font-size: 15px; padding: 6px 0; }
.days { display: grid; gap: 10px; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }

/* ---------- Quiz ---------- */
.game { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; text-align: center; }
.game h2 { justify-content: center; }
.game .lead { margin: 0; color: var(--muted); }
.hud { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--orange); }
.qtext { font-size: 20px; font-weight: 800; margin: 2px 0; text-wrap: balance; color: var(--navy); }
.grid4 { display: grid; gap: 10px; }
@media (min-width: 560px) { .grid4 { grid-template-columns: 1fr 1fr; } }
.ch { border: 0; border-radius: 12px; color: #fff; padding: 14px; font-size: 17px; font-weight: 700; text-align: left; display: flex; gap: 12px; align-items: center; min-height: 62px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.ch b { font-family: var(--display); font-weight: 400; font-size: 22px; background: rgba(0,0,0,.22); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.ch.c0 { background: var(--red); } .ch.c1 { background: #2a3cb8; } .ch.c2 { background: #d85a00; } .ch.c3 { background: #1f8f2f; }
.ch:disabled { opacity: .35; } .ch.pick { opacity: 1; outline: 4px solid var(--ink); outline-offset: 2px; }
.big { font-family: var(--display); font-size: 56px; color: var(--orange); line-height: 1; }
.review { display: grid; gap: 10px; text-align: left; }
.rv { border-radius: 10px; padding: 10px 12px; border-left: 6px solid var(--ok); background: var(--ok-soft); }
.rv.no { border-left-color: var(--bad); background: var(--bad-soft); }
.rv p { margin: 0; } .rv .rq { font-weight: 800; } .rv small { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
.locked { text-align: center; display: grid; gap: 12px; justify-items: center; }
.locked .lk { font-size: 54px; line-height: 1; }
.missing { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.missing span { background: var(--line); border-radius: 6px; padding: 3px 8px; font-weight: 700; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="car" viewBox="0 0 120 64">
    <rect x="38" y="10" width="26" height="5" rx="2" fill="#1d1b3a"/>
    <path d="M6 42 L12 27 Q16 19 27 19 L70 19 Q79 19 87 27 L101 31 Q114 33 115 42 L115 47 L6 47 Z" fill="#e8343a"/>
    <path d="M31 23 L66 23 L79 31 L29 31 Z" fill="#cfe9ff"/>
    <line x1="52" y1="23" x2="52" y2="31" stroke="#e8343a" stroke-width="3"/>
    <rect x="6" y="36" width="109" height="5" fill="#ff6a00"/>
    <circle cx="60" cy="40" r="7" fill="#fff"/>
    <text x="60" y="43" text-anchor="middle" font-size="8" font-weight="800" fill="#0b0a5e" font-family="Rubik, sans-serif">252</text>
    <circle cx="30" cy="49" r="11" fill="#1d1b3a"/><circle cx="30" cy="49" r="4.5" fill="#c9c6d4"/>
    <circle cx="93" cy="49" r="11" fill="#1d1b3a"/><circle cx="93" cy="49" r="4.5" fill="#c9c6d4"/>
    <path d="M3 50 Q10 44 16 50" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div id="intro" role="dialog" aria-label="Abertura do Rally">
  <button class="i-skip" type="button" data-go>Pular</button>
