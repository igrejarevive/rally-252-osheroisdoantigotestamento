# Valida o site e só então publica no GitHub Pages.
# Se a validação falhar, o site no ar continua na versão anterior.
name: Validar e publicar

on:
  push:
    branches: [main]
  # Propostas de atualização (ex.: Dependabot) só passam pela validação, não publicam
  pull_request:
  workflow_dispatch:

# Permissão mínima por padrão; o job de publicação pede só o que precisa
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ações oficiais fixadas por SHA (e não por tag), para uma tag adulterada não entrar no processo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: node scripts/validar.mjs

  publicar:
    needs: validar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Só a pasta public/ vai ao ar; scripts, README e decisões ficam fora
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
